# Local development environment: Bitcoin regtest + Arkade server
# Extracted from Nigiri (https://github.com/vulpemventures/nigiri)
# Usage: docker compose up -d

name: loanmarketplace-dev

services:
  # Bitcoin Core (regtest)
  bitcoin:
    image: ghcr.io/getumbrel/docker-bitcoind:v30.0
    container_name: bitcoin
    restart: on-failure
    stop_grace_period: 30s
    ports:
      - 18443:18443   # RPC
      - 18444:18444   # P2P
      - 28332:28332   # ZMQ block
      - 28333:28333   # ZMQ tx
    volumes:
      - bitcoin-data:/data/.bitcoin
      - ./config/bitcoin.conf:/data/.bitcoin/bitcoin.conf

  # Electrs block explorer + API
  electrs:
    image: ghcr.io/vulpemventures/electrs:latest
    container_name: electrs
    entrypoint:
      - /build/electrs
    command:
      - -vvvv
      - --network
      - regtest
      - --daemon-dir
      - /config
      - --daemon-rpc-addr
      - bitcoin:18443
      - --cookie
      - admin1:123
      - --http-addr
      - 0.0.0.0:30000
      - --electrum-rpc-addr
      - 0.0.0.0:50000
      - --cors
      - "*"
      - --jsonrpc-import
    depends_on:
      - bitcoin
    ports:
      - 30000:30000   # HTTP API (Esplora)
      - 50000:50000   # Electrum RPC
    volumes:
      - bitcoin-data:/config
    restart: unless-stopped

  # Chopsticks: faucet + auto-mining proxy
  chopsticks:
    image: ghcr.io/vulpemventures/nigiri-chopsticks:latest
    container_name: chopsticks
    command:
      - --use-faucet
      - --use-mining
      - --use-logger
      - --rpc-addr
      - bitcoin:18443
      - --electrs-addr
      - electrs:30000
      - --addr
      - 0.0.0.0:3000
    depends_on:
      - bitcoin
      - electrs
    ports:
      - 3000:3000     # Faucet + Esplora proxy
    restart: unless-stopped

  # PostgreSQL (required by nbxplorer)
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    ports:
      - 39372:5432
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_DB=arkd
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # NBXplorer (Bitcoin indexer, required by arkd-wallet)
  nbxplorer:
    image: nicolasdorier/nbxplorer:2.6.0
    container_name: nbxplorer
    restart: unless-stopped
    depends_on:
      - postgres
      - bitcoin
    expose:
      - "32838"
    environment:
      NBXPLORER_NETWORK: regtest
      NBXPLORER_CHAINS: "btc"
      NBXPLORER_BTCRPCURL: http://bitcoin:18443/
      NBXPLORER_BTCNODEENDPOINT: bitcoin:18444
      NBXPLORER_BTCRPCUSER: admin1
      NBXPLORER_BTCRPCPASSWORD: 123
      NBXPLORER_VERBOSE: 1
      NBXPLORER_BIND: 0.0.0.0:32838
      NBXPLORER_TRIMEVENTS: 10000
      NBXPLORER_SIGNALFILESDIR: /datadir
      NBXPLORER_POSTGRES: User ID=postgres;Host=postgres;Port=5432;Application Name=nbxplorer;MaxPoolSize=20;Database=nbxplorer
      NBXPLORER_EXPOSERPC: 1
      NBXPLORER_NOAUTH: 1
    volumes:
      - nbxplorer-data:/datadir
    ports:
      - "32838:32838"

  # Arkade wallet daemon
  ark-wallet:
    image: ghcr.io/arkade-os/arkd-wallet:v0.9.0
    container_name: ark-wallet
    restart: unless-stopped
    depends_on:
      - bitcoin
      - nbxplorer
    environment:
      ARKD_WALLET_LOG_LEVEL: "5"
      ARKD_WALLET_NBXPLORER_URL: "http://nbxplorer:32838"
      ARKD_WALLET_NETWORK: "regtest"
      ARKD_WALLET_SIGNER_KEY: "19422b10efd05403820ff6a3365422be2fc5f07f34a6d1603f7298328f0f80f6"
    volumes:
      - ark-wallet-data:/app/data
    ports:
      - "6060:6060"

  # Arkade server (the one our SDK connects to)
  ark:
    image: ghcr.io/arkade-os/arkd:v0.9.0
    container_name: ark
    restart: unless-stopped
    depends_on:
      - bitcoin
      - ark-wallet
      - postgres
    environment:
      ARKD_LOG_LEVEL: "5"
      ARKD_NO_TLS: "true"
      ARKD_NO_MACAROONS: "true"
      ARKD_WALLET_ADDR: "ark-wallet:6060"
      ARKD_ESPLORA_URL: "http://chopsticks:3000"
      ARKD_VTXO_MIN_AMOUNT: "1"
      ARKD_VTXO_TREE_EXPIRY: "1024"
      ARKD_UNILATERAL_EXIT_DELAY: "512"
      ARKD_BOARDING_EXIT_DELAY: "2048"
      ARKD_DB_TYPE: "sqlite"
      ARKD_EVENT_DB_TYPE: "badger"
      ARKD_LIVE_STORE_TYPE: "inmemory"
      ARKD_UNLOCKER_TYPE: "env"
      ARKD_UNLOCKER_PASSWORD: "secret"
    volumes:
      - ark-data:/app/data
    ports:
      - "7070:7070"   # Arkade server — SDK connects here
      - "7071:7071"   # Arkade admin API — wallet init

volumes:
  bitcoin-data:
  postgres-data:
  nbxplorer-data:
  ark-wallet-data:
  ark-data:

networks:
  default:
    name: nigiri
